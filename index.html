<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EFEDE7">
  <meta name="description" content="物理学（师范）学习中心：课程资料、课表导入与日程计划。">
  <title>物理学（师范） · 学习中心</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css?v=9">
  <script>
    (function () {
      try {
        var seen = sessionStorage.getItem('hub-intro-seen') === '1';
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var isHome = !location.hash || location.hash === '#/home' || location.hash === '#/';
        if (!seen && !reduce && isHome) {
          document.documentElement.classList.add('intro-ready');
          setTimeout(function () {
            document.documentElement.classList.remove('intro-ready');
          }, 1200);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="intro-curtain" id="introCurtain" aria-hidden="true">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <rect x="6" y="9" width="36" height="33" rx="9" fill="#F2F0E8"/>
      <rect x="6" y="9" width="36" height="11" rx="5.5" fill="#A9BCA8"/>
      <rect x="14" y="5" width="4" height="9" rx="2" fill="#A9BCA8"/>
      <rect x="30" y="5" width="4" height="9" rx="2" fill="#A9BCA8"/>
      <rect x="14" y="27" width="9" height="7" rx="2" fill="#1E3B2F"/>
      <rect x="27" y="27" width="7" height="7" rx="2" fill="#D6E4F0"/>
      <rect x="14" y="37" width="20" height="2" rx="1" fill="#D6E4F0"/>
    </svg>
    <b id="introCollege">物理学（师范）</b>
    <span id="introSub">学习中心</span>
    <small id="introWeek">WEEK 09</small>
    <em>点击任意位置跳过</em>
  </div>

  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v16H7.5A2.5 2.5 0 0 0 5 21.5Z"/><path d="M5 5.5v16"/></symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m4 6 1.2 1.2L7.5 4.8M4 12l1.2 1.2 2.3-2.4M4 18l1.2 1.2 2.3-2.4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0 4-4m-4 4-4-4"/><path d="M5 20h14"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6Z"/><path d="M14 3v5h4M9 13h6M9 17h6"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s6-5.4 6-11a6 6 0 1 0-12 0c0 5.6 6 11 6 11Z"/><circle cx="12" cy="10" r="2.2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.2 4.2L19 7"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16v4Z"/><path d="m12.5 6.5 4 4"/></symbol>
  </svg>

  <div class="app-shell">

    <header class="topbar">
      <a class="brand" href="#/home" aria-label="返回首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 26 26">
            <path d="M5 6.4A2.4 2.4 0 0 1 7.4 4H19.5a1 1 0 0 1 1 1v16.5H7.4A2.4 2.4 0 0 1 5 19.1Z" fill="none" stroke="#F1EFE7" stroke-width="1.5"/>
            <path d="M5 6.4v12.7" stroke="#F1EFE7" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M9.4 9.2h7M9.4 12.2h7M9.4 15.2h4.4" stroke="#B9C7B8" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong id="siteTitle">物理学（师范） · 学习中心</strong>
          <small><span id="siteSemester">2026-2027 学年第 1 学期</span></small>
        </span>
      </a>

      <nav class="top-nav" aria-label="主导航">
        <a href="#/home" data-view="home">首页</a>
        <a href="#/timetable" data-view="timetable">课表</a>
        <a href="#/materials" data-view="materials">资料</a>
        <a href="#/planner" data-view="planner">日程</a>
      </nav>

      <div class="top-actions">
        <span class="term-note" id="siteWeekHint">第 9 周 · 示例课表</span>
        <span class="term-note mobile-term" id="mobileSemester">2026-2027 学年第 1 学期</span>
        <button class="btn btn-soft btn-sm" type="button" id="installApp" hidden>
          <svg class="icon"><use href="#i-download"></use></svg>安装
        </button>
        <button class="icon-btn" type="button" id="aboutBtn" aria-label="关于"><svg class="icon"><use href="#i-info"></use></svg></button>
        <button class="icon-btn" type="button" id="settingsBtn" aria-label="设置"><svg class="icon"><use href="#i-settings"></use></svg></button>
        <button class="icon-btn mobile-settings" type="button" id="mobileSettingsBtn" aria-label="设置"><svg class="icon"><use href="#i-settings"></use></svg></button>
      </div>
    </header>

    <main class="main" id="main">
      <section class="view" id="view-home" data-view="home">
        <div id="homeContent"></div>
      </section>

      <section class="view" id="view-timetable" data-view="timetable" hidden>
        <div class="view-head">
          <div>
            <div class="eyebrow">第 <span id="ttWeekNumber">9</span> 周 · <span id="ttWeekRange">10月26日 - 11月1日</span></div>
            <h1>课程表</h1>
            <p class="sub">点空白格子添加课程，点已有课程查看详情。</p>
          </div>
          <div class="head-actions">
            <button class="btn btn-soft" type="button" id="ttImportBtn"><svg class="icon"><use href="#i-upload"></use></svg>导入课表</button>
            <button class="btn btn-primary" type="button" id="ttAddBtn"><svg class="icon"><use href="#i-plus"></use></svg>添加课程</button>
          </div>
        </div>
        <div id="ttContent"></div>
      </section>

      <section class="view" id="view-materials" data-view="materials" hidden>
        <div class="view-head">
          <div>
            <div class="eyebrow">课程资料</div>
            <h1>资料库</h1>
            <p class="sub">按年级和学科浏览课程资料；点击卡片可以查看详情并打开 PDF / DOC 文件。</p>
          </div>
          <span class="count-badge" id="materialsCount">0 份资料</span>
        </div>
        <div class="materials-toolbar">
          <label class="search-box">
            <svg class="icon"><use href="#i-search"></use></svg>
            <input id="materialSearch" type="search" placeholder="按资料名 / 学科 / 标签筛选（全文搜索后期开放）" autocomplete="off">
          </label>
          <div class="filter-group">
            <span class="filter-label">年级</span>
            <div class="chip-row" id="gradeFilter"></div>
          </div>
          <div class="filter-group">
            <span class="filter-label">学科</span>
            <div class="chip-row" id="subjectFilter"></div>
          </div>
        </div>
        <div id="materialsContent"></div>
      </section>

      <section class="view" id="view-planner" data-view="planner" hidden>
        <div class="view-head">
          <div>
            <div class="eyebrow">第 <span id="plannerWeekNumber">9</span> 周 · <span id="plannerWeekRange">10月26日 - 11月1日</span></div>
            <h1>日程计划</h1>
            <p class="sub">作业、实验、社团和生活安排，都放在同一张周历上。</p>
          </div>
          <div class="head-actions">
            <button class="btn btn-soft" type="button" id="plannerPrevBtn"><svg class="icon"><use href="#i-chevron-left"></use></svg>上一周</button>
            <button class="btn btn-soft" type="button" id="plannerNextBtn">下一周<svg class="icon"><use href="#i-chevron-right"></use></svg></button>
            <button class="btn btn-primary" type="button" id="plannerAddBtn"><svg class="icon"><use href="#i-plus"></use></svg>添加任务</button>
          </div>
        </div>
        <div id="plannerContent"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="移动端主导航">
      <a href="#/home" data-view="home"><svg class="icon"><use href="#i-home"></use></svg><span>首页</span></a>
      <a href="#/timetable" data-view="timetable"><svg class="icon"><use href="#i-calendar"></use></svg><span>课表</span></a>
      <a href="#/materials" data-view="materials"><svg class="icon"><use href="#i-book"></use></svg><span>资料</span></a>
      <a href="#/planner" data-view="planner"><svg class="icon"><use href="#i-tasks"></use></svg><span>日程</span></a>
    </nav>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-head">
        <h2 id="modalTitle">标题</h2>
        <button class="icon-btn" type="button" id="modalClose" aria-label="关闭"><svg class="icon"><use href="#i-close"></use></svg></button>
      </header>
      <div class="modal-body" id="modalBody"></div>
      <footer class="modal-foot" id="modalFoot"></footer>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/home.js"></script>
  <script src="js/timetable.js"></script>
  <script src="js/materials.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
